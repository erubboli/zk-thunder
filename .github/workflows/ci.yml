name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"
  SQLX_OFFLINE: "true"
  ZKSYNC_HOME: ${{ github.workspace }}
  TEST_DATABASE_URL: postgres://postgres:notsecurepassword@postgres/zksync_local_test
  TEST_PROVER_DATABASE_URL: postgres://postgres:notsecurepassword@postgres/prover_local_test

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/matter-labs/zk-environment:latest2.0-lightweight
      options: --security-opt seccomp=unconfined

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: notsecurepassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build contracts
        run: zkstack dev contracts

      - name: Set up test databases
        run: |
          sqlx database create --database-url "$TEST_DATABASE_URL"
          sqlx migrate run \
            --source core/lib/dal/migrations \
            --database-url "$TEST_DATABASE_URL"
          sqlx database create --database-url "$TEST_PROVER_DATABASE_URL"
          sqlx migrate run \
            --source prover/crates/lib/prover_dal/migrations \
            --database-url "$TEST_PROVER_DATABASE_URL"

      - name: Run unit tests
        run: cargo nextest run --release
        working-directory: core
